<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System — Architecture</title>
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<link rel="stylesheet" href="cf-style.css">
</head>
<body>

<div class="bar">
  <img class="brand-logo" src="logo.svg" alt="Creative Force">
  <div>
    <h1>System — the stack</h1>
    <div class="sub">one-line subtitle · mono · uppercase</div>
  </div>
  <div class="spacer"></div>
  <div class="chips" id="chips">
    <button class="chip on" data-flow="all">Everything</button>
    <button class="chip" data-flow="sample">Sample flow</button>
  </div>
  <div class="tools">
    <button id="panelToggle">Hide panels</button>
    <button id="themeToggle">Theme</button>
  </div>
</div>

<div class="stage" id="stage">
<!-- Layout tips: nodes ~200×90, gap ≥ 60; size viewBox to content; text baselines
     ~30px below rect top, .m lines every 18px; curve edges with C, label midway.
     Edge endpoints MUST sit on a node border, derived from its rect x,y,w,h — do
     NOT eyeball: right-mid (x+w, y+h/2) · left-mid (x, y+h/2) · top-mid (x+w/2, y)
     · bottom-mid (x+w/2, y+h). A few px off puts the arrow tail inside the box. -->
<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Architecture diagram">
  <defs>
    <marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/>
    </marker>
    <marker id="a-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--clay)"/>
    </marker>
  </defs>

  <!-- zones -->
  <g class="zone" id="z-app">
    <rect x="40" y="100" width="520" height="300"/>
    <text class="ztitle" x="60" y="130">Zone title</text>
    <text class="zsub" x="60" y="148">zone subtitle</text>
  </g>

  <!-- edges (id= is referenced by FLOWS.edges and .elbl data-e) -->
  <path class="edge" id="e-a" d="M280,225 L360,225"/>
  <path class="edge ws" id="e-b" d="M520,220 C 580,220 600,225 660,225"/>
  <path class="edge dash" id="e-c" d="M280,250 C 460,320 520,460 660,460"/>

  <!-- edge labels -->
  <text class="elbl" data-e="e-a" x="288" y="214">calls</text>
  <text class="elbl" data-e="e-b" x="560" y="210">WebSocket</text>
  <text class="elbl" data-e="e-c" x="430" y="360">async / lazy</text>

  <!-- step badges (numbered circles on lit edges) are auto-generated by
       diagram.js from FLOWS[key].edges order — never author them here -->

  <!-- nodes: one of each variant -->
  <g class="node" data-k="client">
    <rect x="80" y="180" width="200" height="90"/>
    <text class="t" x="100" y="210">Default node</text>
    <text class="m" x="100" y="232">mono meta line</text>
    <text class="m" x="100" y="250">second meta line</text>
  </g>
  <g class="node gate" data-k="gate">
    <rect x="360" y="180" width="160" height="80"/>
    <text class="t" x="380" y="210">Gate node</text>
    <text class="k" x="380" y="230">blue kicker</text>
    <text class="m" x="380" y="248">decision point</text>
  </g>
  <g class="node store" data-k="db">
    <rect x="660" y="180" width="220" height="90"/>
    <text class="t" x="680" y="210">Store node</text>
    <text class="m" x="680" y="232">datastore · grey fill</text>
  </g>
  <g class="node ext" data-k="ext">
    <rect x="660" y="420" width="220" height="80"/>
    <text class="t" x="680" y="450">External node</text>
    <text class="m" x="680" y="472">dashed border</text>
  </g>
  <!-- other variant: class="node do" (or edge-n) — soft-blue fill, durable/edge compute -->
</svg>

  <div class="src">source caption · top-right</div>

  <div class="card" id="flowcap">
    <div class="fname" id="f-name"></div>
    <ol id="f-steps"></ol>
  </div>

  <div class="card" id="detail">
    <h3 id="d-title">Click anything</h3>
    <div class="meta" id="d-meta">node detail</div>
    <p id="d-body">Every box is clickable. The chips up top light up request paths.</p>
  </div>
</div>
<script>
const DETAIL = {
  client: { t:"Default node", m:"role · credential", b:"One or two sentences. <b>Bold</b> the load-bearing idea; <code>code</code> for endpoints." },
  gate:   { t:"Gate node", m:"the one gate", b:"Sample second entry — every data-k in the SVG needs a DETAIL key." },
};

const FLOWS = {
  sample: {
    name: "Sample flow — rename me",
    edges: ["e-a","e-b"],
    nodes: ["client","gate","db"],
    steps: ["<code>POST /v1/…</code> — first step", "Second step; keep each to one line"]
  }
};
</script>
<script src="diagram.js"></script>
</body>
</html>
